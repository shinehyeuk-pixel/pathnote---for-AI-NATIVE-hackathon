<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathnote</title>
<style>
:root {
  --bg: #ffffff; --surface: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --node: #c7c7cc;
  --accent: #0066cc; --accent-soft: rgba(0, 102, 204, 0.12); --warn: #b3261e; --out: #b25000; --world: #7a3db8;
  --font: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Inter, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --surface: #1d1d1f; --ink: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --node: #48484a;
    --accent: #2997ff; --accent-soft: rgba(41, 151, 255, 0.16); --warn: #ff6b5b; --out: #ff9f0a; --world: #bf8cff; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.43 var(--font); display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar strong { font-weight: 600; }
.vault { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 9999px; background: var(--surface); color: var(--muted); }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.chip.on { background: var(--accent-soft); color: var(--accent); }
.chip.on i { background: var(--accent); }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.graph { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line); overflow: hidden; }
svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; transform-origin: 0 0; will-change: transform; }
svg.drag { cursor: grabbing; }
.note { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 10px 14px; border-radius: 11px; background: var(--surface); color: var(--muted); font-size: 12px; }
.note b { color: var(--ink); font-weight: 600; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; pointer-events: none; }
.empty.low { place-items: end center; padding-bottom: 32px; } /* under the folders' dots, not over them */
.log { display: flex; flex-direction: column; min-height: 0; }
.log h2 { font-size: 14px; font-weight: 600; margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
ol { list-style: none; margin: 0; padding: 8px 0; flex: 1; min-height: 0; overflow-y: auto; }
li { padding: 8px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
li.now { background: var(--accent-soft); }
.tool { font: 500 12px var(--mono); color: var(--accent); }
.undo .tool { color: var(--muted); }
time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.text { grid-column: 1 / -1; overflow-wrap: anywhere; }
.why { grid-column: 1 / -1; color: var(--muted); }
/* Plain words by default; the calls as made (commands, tool names, internal steps) in developer mode */
.log:not(.dev) .d, .log.dev .p, .log:not(.dev) li.quiet { display: none; }
.tool .p { font-family: var(--font); }
#dev[aria-pressed="true"], #allFiles[aria-pressed="true"] { background: var(--accent); color: #fff; }
.log h2 { flex-wrap: wrap; gap: 8px; }
.log h2 .row { display: flex; gap: 8px; flex-wrap: wrap; }
.log h2 .btn { white-space: nowrap; }
.err { grid-column: 1 / -1; color: var(--warn); font-size: 12px; }
li .btn { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }
.btn { font: 400 13px/1 var(--font); min-height: 30px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.btn:active { transform: scale(0.95); }
.btn:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: default; }
.hint { padding: 16px; color: var(--muted); }
/* What was said: the request that starts a turn, and Claude's replies. Long ones are cut to a few lines */
li.ask { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
li.ask .text { font-weight: 600; }
li.ask .tool, li.say .tool { font-family: var(--font); }
li.say .text { color: var(--muted); }
li.ask .text, li.say .text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
li.failed .tool { color: var(--warn); }

/* --k = user units per screen pixel, so names, rings and the pulse keep their on-screen size while zooming.
   It is set only on their layers (see setView): changing it restyles every element under it, and dots don't need it */
svg { --k: 1; }
line { vector-effect: non-scaling-stroke; }
.tree { stroke: var(--line); stroke-width: 1; }
/* Lines and dimmed nodes fade with stroke-/fill-opacity, not opacity: opacity on thousands of elements makes
   Chrome treat each as its own layer to sort out on every repaint (hundreds of ms on a click or Escape) */
.link { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 4; stroke-opacity: .35; }
.trail { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset .6s ease-in-out, opacity .4s, stroke-opacity .4s; }
.src { stroke: var(--accent); stroke-width: 1.5; stroke-opacity: .6; }
.node .dot, .node .hole { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
/* A dot is a zero-length line with round ends and a stroke that doesn't scale, so it keeps its on-screen size at any zoom
   without --k: zooming then restyles a few thousand names instead of every dot as well (about 60ms down to 25 on 5,000 files) */
.node .dot { stroke: var(--node); stroke-width: 7px; transition: stroke .5s; }
.node.dir .dot { stroke-width: 10px; }
.node.root .dot { stroke-width: 16px; stroke: var(--ink); }
/* Places the AI goes that aren't files (the terminal, the web, other apps) sit on a ring around the AI in the middle.
   They are hollow: a smaller dot in the background colour on top */
.node.place .dot { stroke-width: 14px; stroke: var(--ink); }
.node.place .hole { stroke-width: 11px; stroke: var(--bg); }
.node.ai .dot { stroke-width: 21px; stroke: var(--accent); }
.node.ai .hole { stroke-width: 16px; }
/* Sites and services outside this computer, around the place that reached them */
.node.site .dot, .node.site.visited .dot { stroke-width: 10px; stroke: var(--world); }
.node.site .hole { stroke-width: 7px; stroke: var(--bg); }
.node.site.app .dot { stroke-width: 14px; }
.node.site.app .hole { stroke-width: 9px; }
.node.site.out .dot, .node.site.out.visited .dot { stroke: var(--out); }
.node.site text { fill: var(--world); }
/* the line between this computer and the outside: sites and other apps' services live beyond it */
.edge { fill: none; stroke: var(--world); stroke-width: 1.5; stroke-dasharray: 5 7; stroke-opacity: .45; vector-effect: non-scaling-stroke; }
.edgeName { fill: var(--world); font: 600 12px var(--font); text-anchor: middle; opacity: .8; }
/* The blueprint panel: one piece of work as a mind map and as text another agent can follow */
.bp { position: absolute; inset: 0; z-index: 4; background: var(--bg); overflow-y: auto; padding: 14px 16px 20px; display: grid; gap: 10px; align-content: start; }
.bp header { display: flex; align-items: center; gap: 8px; }
.bp header b { flex: 1; font-size: 15px; }
.bp .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bp select, .bp input { font: 13px var(--font); min-height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; flex: 1 1 160px; }
.bp label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; flex: 1 1 160px; }
.bp textarea { font: 12px/1.5 var(--mono); min-height: 220px; padding: 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; width: 100%; }
.bp svg { width: 100%; height: auto; border-radius: 11px; background: var(--surface); }
.bp .say { font-size: 12px; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
.bp .say.bad { color: var(--warn); }
.bp [hidden] { display: none; }
.pn circle:first-child { fill: var(--node); }
.pn.place circle:first-child { fill: var(--bg); stroke: var(--ink); stroke-width: 3.5; }
.pn.file.written circle:first-child { fill: var(--accent); }
.pn.site circle:first-child, .pn.app circle:first-child { fill: var(--bg); stroke: var(--world); stroke-width: 3; }
.pn.site.out circle:first-child, .pn.app.out circle:first-child { stroke: var(--out); }
.pai { fill: var(--accent); }
.pl { fill: var(--muted); font: 12px var(--font); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.pn.place .pl, .pn.written .pl, .pai-t { fill: var(--ink); font-weight: 600; }
.pn.site .pl, .pn.app .pl { fill: var(--world); }
.pn.out .pl { fill: var(--out); }
.pflow { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; opacity: .85; }
.phead, .pdot { fill: var(--accent); }
.pflow.out { stroke: var(--out); } .phead.out, .pdot.out { fill: var(--out); }
.pflow.bad { stroke: var(--warn); } .phead.bad, .pdot.bad { fill: var(--warn); }
.pt { fill: var(--ink); font: 600 15px var(--font); }
.pg { fill: var(--muted); font: 12px var(--font); }
.ph { fill: var(--ink); font: 600 12px var(--font); }
.ps { fill: var(--muted); font: 12px var(--font); }
.ps.out { fill: var(--out); font-weight: 600; } .ps.bad { fill: var(--warn); }
.tree.world { stroke: var(--world); stroke-opacity: .5; stroke-dasharray: 2 4; }
li.out { box-shadow: inset 3px 0 0 var(--out); }
/* Each request with what came of it; its steps fold away under it */
li.folded { display: none; }
/* Suggestions: steps or requests worth doing differently, in red, with a ripple on the map */
li.flag { box-shadow: inset 3px 0 0 var(--warn); }
.flagwhy { grid-column: 1 / -1; color: var(--warn); font-size: 12px; font-weight: 600; }
li.flag.fresh { animation: flagpulse 1.2s ease-out 2; }
@keyframes flagpulse { 0% { background: color-mix(in srgb, var(--warn) 22%, transparent); } 100% { background: transparent; } }
.sum .stats .s { color: var(--warn); }
.ripple { fill: none; stroke: var(--warn); stroke-width: 2.5; vector-effect: non-scaling-stroke; animation: ripple 1.6s ease-out 3; opacity: 0; }
.ripple.r2 { animation-delay: .5s; }
.flagring { fill: none; stroke: var(--warn); stroke-width: 2; vector-effect: non-scaling-stroke; }
@keyframes ripple { 0% { r: 8px; opacity: .9; } 100% { r: 44px; opacity: 0; } }
/* The flow of one request: numbered arrows along the way it went */
.flowline { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .9; }
.flowhead { fill: var(--accent); }
.flownum { fill: #fff; font: 700 9px var(--font); text-anchor: middle; dominant-baseline: central; }
.flowdot { fill: var(--accent); }
.sum { grid-column: 1 / -1; display: grid; gap: 4px; margin-top: 6px; }
.sum .res { color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.sum .res:empty, .sum .stats:empty { display: none; }
.sum .stats { font-size: 12px; color: var(--muted); }
#log a { color: var(--accent); overflow-wrap: anywhere; }
.sum .stats b { font-weight: 600; }
.sum .stats .o { color: var(--out); }
.sum .stats .f { color: var(--warn); }
.sum .more { justify-self: start; font: 12px var(--font); color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; }
li.ask .text { font-size: 15px; }
.outtag { grid-column: 1 / -1; color: var(--out); font-size: 12px; font-weight: 600; }
.node.place.visited .hole { display: none; }
.node.place text { font-weight: 600; fill: var(--ink); }
.node text { font-family: var(--font); font-size: calc(var(--k) * 11px); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: calc(var(--k) * 4px); stroke-linejoin: round; pointer-events: none; display: none; }
.node.root text { font-size: calc(var(--k) * 13px); font-weight: 600; fill: var(--ink); }
.node.root text, .node.place text, .node.top text, .node.hit text, .node.visited text, .node.written text, svg.near .node.dir text, svg.close .node text { display: inline; }
/* a name that would sit on a more important one stays hidden (see declutter) */
.node.crowd text { display: none !important; }
.ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0; r: calc(var(--k) * 11px); vector-effect: non-scaling-stroke; }
.node.hit .ring { opacity: 1; }
.node.visited .dot, .node.written .dot { stroke: var(--accent); }
.node.visited text, .node.written text { fill: var(--ink); font-weight: 600; }
/* One pulse for the whole map, moved to the current node and drawn last. Its animation runs on the GPU;
   giving each node its own and restarting it on every event made the browser re-split the whole map into
   layers on each event (~100ms with thousands of files), and anything drawn above it gets split off too */
.pulse { r: calc(var(--k) * 6px); fill: var(--accent); opacity: 0; animation: pulse 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; pointer-events: none; }
#pulse.gone { opacity: .25; }
svg.focus #pulse { opacity: .15; }
svg.focus #pulse.lit { opacity: 1; }
.node.gone { opacity: .25; }
.node.gone text { text-decoration: line-through; }
/* Selecting: a log entry or a dot lights its files and connections and dims the rest */
/* opacity: 1 also keeps a gone node at the same dim as the rest while selecting, as before */
svg.focus .node { opacity: 1; fill-opacity: .15; stroke-opacity: .15; }
svg.focus .node.lit { fill-opacity: 1; stroke-opacity: 1; }
svg.focus .node.lit text { display: inline; fill: var(--ink); font-weight: 600; }
svg.focus line { stroke-opacity: .1; }
svg.focus line.lit { stroke-opacity: 1; stroke-width: 2.5; }
svg.focus .tree.lit, svg.focus .link.lit { stroke: var(--accent); }
.node.sel .dot { stroke: var(--accent); stroke-width: 12px; }
.node.sel .ring { opacity: 1; stroke-dasharray: none; }
li[tabindex] { cursor: pointer; }
li[tabindex]:hover { background: var(--surface); }
li.touch { box-shadow: inset 3px 0 var(--accent); }
li.sel { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
li:focus-visible { outline: 2px solid #0071e3; outline-offset: -2px; }
.controls { position: absolute; right: 12px; top: 12px; display: grid; gap: 6px; }
.controls button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 400 18px/1 var(--font); cursor: pointer; display: grid; place-items: center; padding: 0; }
.controls button:active { transform: scale(0.95); }
.controls button:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
.controls svg { width: 16px; height: 16px; cursor: inherit; }
.card { position: absolute; left: 12px; top: 12px; max-width: min(360px, calc(100% - 24px)); padding: 12px 14px; border-radius: 11px; background: var(--surface); display: grid; gap: 4px; }
.card b { font-weight: 600; overflow-wrap: anywhere; }
.card span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.card .row { display: flex; gap: 8px; margin-top: 6px; }
/* The AI asks to use another folder: on top of everything until the user answers */
.asking { position: absolute; z-index: 3; top: 12px; left: 50%; transform: translateX(-50%); width: min(440px, calc(100% - 24px)); padding: 14px 16px; border-radius: 14px; background: var(--bg); border: 1.5px solid var(--accent); box-shadow: 0 8px 28px rgba(0, 0, 0, .18); display: grid; gap: 6px; }
.asking b { font-weight: 600; }
.asking code { font: 13px var(--mono); overflow-wrap: anywhere; }
.asking span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.asking .row { display: flex; gap: 8px; margin-top: 6px; }
.btn.primary { background: var(--accent); color: #fff; }
@keyframes pulse { from { transform: scale(1); opacity: .35; } to { transform: scale(3.2); opacity: 0; } }
/* New entries slide in and the card fades in, so the panel moves instead of jumping */
#log li { animation: enter .45s ease-out; }
/* names that appear as the agent reaches a file fade in rather than pop (only these few, not the whole map) */
.node.hit text, .node.visited text, .node.written text { animation: fade .5s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
.card { animation: show .2s ease-out; }
@keyframes show { from { opacity: 0; transform: translateY(-4px); } }
@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
  .graph { border-right: 0; border-bottom: 1px solid var(--line); }
}
/* Narrow windows and touch screens: buttons big enough to hit with a finger, with room between them */
@media (max-width: 760px), (pointer: coarse) {
  .controls { right: 14px; top: 14px; gap: 12px; }
  .controls button { width: 46px; height: 46px; font-size: 24px; }
  .controls svg { width: 20px; height: 20px; }
  .btn { min-height: 40px; padding: 0 18px; font-size: 15px; }
  li .btn { margin-top: 8px; }
  .card { padding: 14px 16px; gap: 6px; }
  .card b { font-size: 16px; }
  .card span { font-size: 13px; }
  .card .row { margin-top: 8px; }
}
/* Narrow: the card sits low and flat, name and info beside the button, so it doesn't cover the lit dots */
@media (max-width: 760px) {
  .card { top: auto; bottom: 12px; right: 72px; max-width: none; /* right: clear of the zoom buttons */ grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; padding: 10px 12px 10px 16px; }
  .card b, .card span { grid-column: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cardPath { display: none; }
  .card .row { grid-column: 2; grid-row: 1 / span 3; margin: 0; flex-direction: column; align-items: end; }
  .card .err { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bar">
  <strong>Pathnote</strong>
  <span class="vault" id="roots"></span>
  <button class="btn" id="allFiles" type="button" aria-pressed="false"></button>
  <span class="chip" id="status"><i></i><span id="statusText"></span></span>
</div>
<div class="main">
  <div class="graph">
    <svg id="g" role="img"></svg>
    <div class="empty" id="empty" hidden></div>
    <p class="note" id="note" hidden></p>
    <div class="controls">
      <button type="button" id="home"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 7.5 8 3l5.5 4.5V13h-3.5V9.5h-4V13H2.5z"/></svg></button>
      <button type="button" id="zoomIn">+</button>
      <button type="button" id="zoomOut">−</button>
    </div>
    <div class="asking" id="ask" role="alertdialog" aria-labelledby="askTitle" hidden>
      <b id="askTitle"></b><code id="askPath"></code><span id="askWhy"></span><span id="askHint"></span>
      <div class="row"><button class="btn primary" id="askYes" type="button"></button><button class="btn" id="askNo" type="button"></button></div>
    </div>
    <section class="bp" id="bp" hidden aria-labelledby="bpTitle">
      <header><b id="bpTitle"></b><button class="btn" id="bpClose" type="button"></button></header>
      <div class="row">
        <label><span id="bpSessionL"></span><select id="bpSession"></select></label>
        <label><span id="bpFromL"></span><select id="bpFrom"></select></label>
        <label><span id="bpToL"></span><select id="bpTo"></select></label>
      </div>
      <svg id="bpMap" viewBox="0 0 960 600" role="img"></svg>
      <label><span id="bpNameL"></span><input id="bpName"></label>
      <textarea id="bpText" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn primary" id="bpUpdate" type="button" hidden></button><button class="btn primary" id="bpClaude" type="button"></button><button class="btn" id="bpCodex" type="button"></button>
        <button class="btn" id="bpFile" type="button"></button><button class="btn" id="bpPolish" type="button"></button>
      </div>
      <p class="say" id="bpSay" role="status"></p>
    </section>
    <div class="card" id="card" hidden>
      <b id="cardName"></b><span id="cardPath"></span><span id="cardInfo"></span>
      <div class="row"><button class="btn" id="reveal" type="button"></button><span class="err" id="cardErr"></span></div>
    </div>
  </div>
  <div class="log">
    <h2><span id="logTitle"></span><span class="row"><button class="btn" id="trOn" type="button" hidden></button><button class="btn" id="bpOpen" type="button"></button><button class="btn" id="dev" type="button" aria-pressed="false"></button><button class="btn" id="clear" type="button"></button></span></h2>
    <ol id="log" aria-live="polite"></ol>
    <p class="hint" id="hint"></p>
  </div>
</div>
<script>
// ?lang=ko or ?lang=en picks the page's language; otherwise the browser's
const ko = (new URLSearchParams(location.search).get('lang') || navigator.language || '').toLowerCase().startsWith('ko');
const mac = /Mac/.test(navigator.platform || navigator.userAgent);
const L = ko ? {
  live: '연결됨', off: '연결 끊김', activity: '작업 기록', clear: '경로 지우기', undo: '되돌리기', undone: '되돌림',
  wait: 'AI가 연결된 폴더에서 일하면 요청, 답, 명령, 파일까지 모든 단계가 여기에 쌓입니다.', empty: '연결된 폴더가 비어 있습니다.',

new MutationObserver(rs => {

function setView() {

}

// Names run sideways from their dots at a fixed screen size, so files next to each other print their names
// on top of one another. Keep the one that matters most (the file the AI is on, then the selection, then what

// layout, so it runs once after a burst of events or when the view settles, and only while few names show

  for (const g of gNodes.querySelectorAll('.crowd')) { g.classList.remove('crowd'); g.label.classList.remove('crowd'); }
  if (svg.classList.contains('close')) return; // close in, there's room and every name shows
  const focus = svg.classList.contains('focus');

// The view that shows every node. animate: glide there instead of jumping

  // where they sit: inner ones evenly from the top, outer ones toward the place that reached them, spread apart
  const pos = new Map([[AIN, [cx, cy]]]), ang = new Map();
  [...inner].forEach(([id], i, a) => { const t = -Math.PI / 2 + i * 2 * Math.PI / a.length; ang.set(id, t); pos.set(id, [cx + Math.cos(t) * R1, cy + Math.sin(t) * R1]); });
  const want = [...outer].map(([id, n], i, a) => [id, ang.has(n.from) ? ang.get(n.from) : -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / a.length]).sort((x, y) => x[1] - y[1]);
  const gap = Math.min(0.42, 2 * Math.PI / Math.max(1, want.length));
  for (let i = 1; i < want.length; i++) if (want[i][1] - want[i - 1][1] < gap) want[i][1] = want[i - 1][1] + gap;
  for (const [id, t] of want) { ang.set(id, t); pos.set(id, [cx + Math.cos(t) * R3, cy + Math.sin(t) * R3]); }

  // the ring between this computer and the outside, the spokes, and the nodes
  if (outer.size) { add('circle', { class: 'edge', cx, cy, r: R2 }); add('text', { class: 'edgeName', x: cx, y: cy - R2 - 8 }).textContent = L.outside; }
  for (const [id] of inner) { const [x, y] = pos.get(id); add('line', { class: 'tree', x1: cx, y1: cy, x2: x, y2: y }); }
  for (const [id, n] of outer) { const [x, y] = pos.get(id), [fx, fy] = pos.get(n.from) || [cx, cy]; add('line', { class: 'tree world', x1: fx, y1: fy, x2: x, y2: y }); }
  const gFlowP = add('g', {}), gNodes = add('g', {});
  const dot = (id, n) => {
    const [x, y] = pos.get(id), g = add('g', { class: `pn ${n.kind}${n.written ? ' written' : ''}${n.out ? ' out' : ''}` }, gNodes);
    add('circle', { cx: x, cy: y, r: n.kind === 'file' ? 5 : n.kind === 'app' ? 8 : 7 }, g);
    if (n.failed) { add('circle', { class: 'flagring', cx: x, cy: y, r: 13 }, g); for (const c of ['ripple', 'ripple r2']) add('circle', { class: c, cx: x, cy: y, r: 8 }, g); }
    // inside the ring a name sits beside its dot, away from the AI; outside it, under or over the dot, where
    // there is more room than between the dot and the drawing's edge
    const t = ang.get(id), side = n.kind === 'file' || n.kind === 'place', right = side && Math.cos(t) > 0.2, left = side && Math.cos(t) < -0.2, below = Math.sin(t) > -0.2;
    const lx = right ? x + 12 : left ? x - 12 : x, ly = right || left ? y + 4 : below ? y + 24 : y - 15;
    const room = right ? COL - 14 - lx : left ? lx - 8 : 2 * Math.min(x - 8, COL - 14 - x, 130);
    label(g, lx, ly, n.name, 'pl', right ? 'start' : left ? 'end' : 'middle', room);
  };
  for (const [id, n] of inner) dot(id, n);
  for (const [id, n] of outer) dot(id, n);
  add('circle', { class: 'pai', cx, cy, r: 13 }, gNodes);
  add('text', { class: 'pl pai-t', x: cx, y: cy + 30, 'text-anchor': 'middle' }, gNodes).textContent = L.ai;

  // the steps as numbered arrows, each from where the last one ended; the number sits on the last hop
  let at = AIN;
  const seen = new Map();
  hops.forEach(({ s, path }, i) => {
    const cls = s.failed ? 'bad' : s.out ? 'out' : '';
    path.forEach((id, j) => {
      const last = j === path.length - 1;
      if (id === at) { if (last) badge(...pos.get(id), 0, -20 - (seen.get(id) || 0) * 18, i + 1, cls), seen.set(id, (seen.get(id) || 0) + 1); return; }
      const [x1, y1] = pos.get(at), [x2, y2] = pos.get(id), k = `${at} ${id}`, n = seen.get(k) || 0; seen.set(k, n + 1);
      add('line', { class: `pflow ${cls}`, x1, y1, x2, y2 }, gFlowP);
      const t = 0.62, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t, a = Math.atan2(y2 - y1, x2 - x1), deg = a * 180 / Math.PI;
      add('path', { class: `phead ${cls}`, d: 'M-7 -5 L7 0 L-7 5 Z', transform: `translate(${x} ${y}) rotate(${deg})` }, gFlowP);
      // the number beside the line, and further out each time the same hop comes again
      const off = 15 + n * 19;
      if (last) badge(x, y, -Math.sin(a) * off, Math.cos(a) * off, i + 1, cls);
      at = id;
    });
  });
  function badge(x, y, dx, dy, n, cls) {
    add('circle', { class: `pdot ${cls}`, cx: x + dx, cy: y + dy, r: 8 }, gFlowP);
    add('text', { class: 'flownum', x: x + dx, y: y + dy }, gFlowP).textContent = n;
  }

  // beside the map: the title and goal, the steps in words with their numbers, then what's needed, made and warned about
  const X = narrow ? 20 : COL + 16, RW = W - X - 12;
  let y = narrow ? 2 * cy + 24 : 34;
  if (narrow) H = Infinity;
  label(map, X, y, b.title, 'pt', 'start', RW); y += 22;
  if (b.goal && b.goal !== b.title) { label(map, X, y, b.goal, 'pg', 'start', RW); y += 20; }
  const head = text => { y += 14; label(map, X, y, text, 'ph', 'start', RW); y += 20; };
  const rest = [
    [L.mm.prepare, [...b.prepare.logins, ...b.prepare.reads.map(fileName)], ''],
    [L.mm.results, b.results.files.map(fileName), ''],
    [L.mm.pitfalls, b.pitfalls.map(p => p.step ? `${p.step}: ${p.error}` : p.error), 'bad']
  ].filter(r => r[1].length);
  const roomFor = H - 16 - y - 34 - rest.reduce((a, r) => a + 34 + Math.min(2, r[1].length) * 18, 0);
  head(L.mm.steps);
  const fits = narrow ? 20 : Math.max(3, Math.floor(roomFor / 19)), shown = hops.slice(0, hops.length > fits ? fits - 1 : fits);
  shown.forEach(({ s }, i) => {
    const cls = s.failed ? 'bad' : s.out ? 'out' : '';
    add('circle', { class: `pdot ${cls}`, cx: X + 8, cy: y - 4, r: 8 });
    add('text', { class: 'flownum', x: X + 8, y: y - 4 }).textContent = i + 1;
    const t = label(map, X + 24, y, s.text, `ps ${cls}`, 'start', RW - 24);
    t.fit = words => fitText(t, words, RW - 24); toKorean(t, s.text); t.fit(s.text);
    y += 19;
  });
  if (hops.length > shown.length) { label(map, X + 24, y, L.mm.more(hops.length - shown.length), 'ps', 'start', RW); y += 19; }
  for (const [name, items, cls] of rest) {
    if (y > H - 50) break;
    head(name);
    for (const it of items.slice(0, Math.max(1, Math.min(2, Math.floor((H - 14 - y) / 18))))) { label(map, X, y, it, `ps ${cls}`, 'start', RW); y += 18; }
    if (items.length > 2 && y < H - 14) { label(map, X, y, L.mm.more(items.length - 2), 'ps', 'start', RW); y += 18; }
  }
  if (narrow) map.setAttribute('viewBox', `0 0 ${W} ${y + 8}`);
}
async function saveBp(target) {
  try {
    const res = await fetch('/api/blueprint/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('bpName').value, target, text: $('bpText').value }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error);
    bpSay(`${L.bpSaved(r.file)} ${target === 'claude' ? L.bpSavedClaude(r.name) : target === 'codex' ? L.bpSavedCodex(r.name) : ''}`);
  } catch (e) { bpSay(e.message, true); }
}
$('bpClaude').onclick = () => saveBp('claude');
$('bpCodex').onclick = () => saveBp('codex');
$('bpFile').onclick = () => saveBp('file');
$('bpPolish').onclick = async () => {
  try { await navigator.clipboard.writeText(`${L.bpPrompt}\n\n${$('bpText').value}`); bpSay(L.copied); } catch (e) { bpSay(e.message, true); }
};

// Folder requests waiting for the user, oldest first
const asks = new Map(), askEl = document.getElementById('ask');
document.getElementById('askTitle').textContent = L.ask;
document.getElementById('askHint').textContent = L.askHint;
document.getElementById('askYes').textContent = L.yes;
document.getElementById('askNo').textContent = L.no;
function showAsk() {
  const a = asks.values().next().value;
  askEl.hidden = !a;
  if (!a) return;
  askEl.dataset.id = a.id;
  document.getElementById('askPath').textContent = a.path;
  document.getElementById('askWhy').textContent = a.reason || '';
}
for (const [id, yes] of [['askYes', true], ['askNo', false]]) {
  document.getElementById(id).onclick = async () => {
    const id = askEl.dataset.id;
    askEl.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try { await fetch('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, yes }) }); } catch {}
    askEl.querySelectorAll('button').forEach(b => { b.disabled = false; });
    // the server's "answered" event hides it; if the request was already answered elsewhere, hide it now
    asks.delete(id); showAsk();
  };
}

document.getElementById('clear').onclick = () => {
  for (const l of lineAt.values()) forget(l);
  gTrail.textContent = ''; lineAt.clear();
  for (const g of nodeEl.values()) g.classList.remove('hit', 'visited', 'written');
  setCurrent(null); lastAt.clear(); readBy.clear();
  unfocus();
};

// ---- Selecting ----
const card = document.getElementById('card');
let litEls = []; // what light() and selecting lit, to unlight without searching the whole map
let selected = null, lastTap = { id: null, t: 0 };

function unfocus() {
  crowdLater();
  gFlow.textContent = ''; flowOf = null;
  svg.classList.remove('focus');
  for (const n of litEls) n.classList.remove('lit', 'sel');
  litEls = [];
  logEl.querySelectorAll('.sel, .touch').forEach(li => li.classList.remove('sel', 'touch'));
  card.hidden = true;
  selected = null;
}

// The way one request went, as numbered arrows: the AI, then each place, file or site in turn. A hop
// already drawn isn't drawn again. Returns the dots it passes.
function drawFlow(g) {
  gFlow.textContent = ''; flowOf = g;
  const seq = [AI];
  for (const li of g.items) for (const id of (li.paths || []).slice(0, 3)) if (pos.has(id) && seq[seq.length - 1] !== id) seq.push(id);
  const done = new Set();
  let n = 0;
  for (let i = 1; i < seq.length && n < 60; i++) {
    const a = seq[i - 1], b = seq[i], key = `${a} ${b}`;
    if (done.has(key)) continue;
    done.add(key); n++;
    const [x1, y1] = pos.get(a), [x2, y2] = pos.get(b);
    gFlow.append(el('line', { class: 'flowline', x1, y1, x2, y2 }));
    // the arrowhead and the hop's number, two thirds of the way along
    const t = 0.66, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t, deg = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    const at = el('g', { transform: `translate(${x} ${y})` }), inner = el('g', { style: 'scale: var(--k)' }), turn = el('g', { transform: `rotate(${deg})` });
    turn.append(el('path', { class: 'flowhead', d: 'M-8 -6 L8 0 L-8 6 Z' }));
    const dot = el('circle', { class: 'flowdot', cx: 0, cy: -15, r: 8 }), num = el('text', { class: 'flownum', x: 0, y: -15 });
    num.textContent = n;
    inner.append(turn, dot, num); at.append(inner); gFlow.append(at);
  }
  return new Set(seq);
}

// Light these nodes and the lines between lit nodes
function light(ids) {
  crowdLater();
  svg.classList.add('focus');
  const lit = n => { n.classList.add('lit'); litEls.push(n); };
  for (const id of ids) {
    const g = nodeEl.get(id);
    if (g) lit(g);
    for (const l of lines(id)) if (ids.has(l.dataset.from) && ids.has(l.dataset.to)) lit(l);
  }
  if (ids.has(current)) lit(gPulse);
}

// How wide a lit (semibold, 11px) file name is on screen
const nameWidth = (() => {
  const c = document.createElement('canvas').getContext('2d');
  return t => { c.font = `600 11px ${getComputedStyle(document.body).fontFamily}`; return c.measureText(t).width; };
})();

// Zoom smoothly so these nodes fill the map, with room for their names.
// top, bottom: screen pixels the nodes stay clear of (the card over the map)
function zoomTo(ids, top = 0, bottom = 0) {
  const list = [...ids].filter(id => pos.has(id)).slice(0, 300);
  if (!list.length) return;
  held = true;
  const W = Math.max(1, svg.clientWidth), H = Math.max(1, svg.clientHeight), pad = 16;
  // Names run sideways from their dots at a fixed screen size (right of the dot on the circle's right half, left of
  // it on the left half), so measure how far each reaches and zoom so the farthest ones just fit, not a fixed margin
  // on both sides, which on a narrow map left the drawing small
  const it = list.map(id => {
    const [x, y] = pos.get(id), n = nameWidth(nameOf(id)) + 10 + pad, right = Math.cos(angleOf.get(id) ?? 0) >= 0;
    return { x, y, L: right ? pad : n, R: right ? n : pad };
  });
  let s = 700 / W; // map units per screen pixel; never closer than this
  for (const a of it) for (const b of it) { const room = W - a.R - b.L; if (room > 0) s = Math.max(s, (a.x - b.x) / room); }
  const ys = it.map(o => o.y);
  const room = Math.max(1, H - 60 - top - bottom);
  s = Math.max(s, (Math.max(...ys) - Math.min(...ys)) / room);
  const x0 = Math.min(...it.map(o => o.x - o.L * s)), x1 = Math.max(...it.map(o => o.x + o.R * s));
  const cx = (x0 + x1) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  // the middle of the free band, not of the whole map
  glide({ x: cx - W * s / 2, y: cy - (top + (H - top - bottom) / 2) * s, w: W * s, h: H * s });
}

// A log entry: its files, and for each the step of the path that led to it
function selectEntry(li) {
  if (li.classList.contains('sel')) return unfocus();
  unfocus();
  li.classList.add('sel');
  const ids = new Set(li.paths.filter(p => nodeEl.has(p)));
  for (const id of [...ids]) for (const l of lines(id)) if (l.parentNode === gTrail && l.dataset.to === id && l.style.opacity !== '0') ids.add(l.dataset.from);
  light(ids);
  for (const p of li.paths) { const g = nodeEl.get(p); if (g) { g.classList.add('sel'); litEls.push(g); } }
  // a request: its whole flow, numbered arrows from the AI through each place it went
  const g = li.classList.contains('ask') && groupOf.get(Number(li.dataset.g));
  if (g) { for (const id of drawFlow(g)) ids.add(id); light(ids); }
  zoomTo(ids);
  // draw the lit path again end to end, one line after another, so it reads as a route
  if (!still.matches) [...gTrail.querySelectorAll('line.lit')].forEach((l, i) => {
    const len = Math.hypot(l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value);
    l.style.strokeDasharray = len;
    l.animate({ strokeDashoffset: [len, 0] }, { duration: 500, delay: 200 + i * 70, easing: 'ease-in-out', fill: 'backwards' });
  });
}

// A dot: it, everything a line joins it to, and the log entries that touched it.
// A second click on the same dot shows it in Finder.
function tap(id) {
  if (!id) return unfocus();
  const now = Date.now();
  if (lastTap.id === id && now - lastTap.t < 400 && (!id.startsWith(PLACE) || (id.startsWith(SITE) && id !== SITE + 'git'))) { id.startsWith(SITE) ? openSite(id) : reveal(id); lastTap = { id: null, t: 0 }; return; }
  lastTap = { id, t: now };
  if (selected === id) return;
  unfocus();
  selected = id;
  const ids = new Set([id]);
  for (const l of lines(id)) if (l.isConnected) ids.add(l.dataset.from === id ? l.dataset.to : l.dataset.from);
  light(ids);
  nodeEl.get(id).classList.add('sel'); litEls.push(nodeEl.get(id));
  let steps = 0, last = null;
  for (const li of logEl.children) if (li.paths?.includes(id)) { li.classList.add('touch'); steps++; last = li; }
  last?.scrollIntoView({ block: 'nearest' });
  const place = id.startsWith(PLACE);
  document.getElementById('cardName').textContent = nameOf(id);
  document.getElementById('cardPath').textContent = place ? '' : short(id);
  // a site opens in the browser; a file or folder shows in Finder (Explorer); a place has neither
  const site = id.startsWith(SITE) && id !== SITE + 'git' && !id.startsWith(PLACE + 'app:');
  document.getElementById('reveal').hidden = place && !site;
  document.getElementById('reveal').textContent = site ? L.openSite : L.reveal;
  document.getElementById('cardInfo').textContent = [L.links(ids.size - 1), steps ? L.steps(steps) : ''].filter(Boolean).join(', ');
  document.getElementById('cardErr').textContent = '';
  card.hidden = false;
  // bring it and everything it connects to into view, names included, clear of the card (top left; at the
  // bottom on narrow windows). Without this a dot clicked while zoomed in elsewhere left its neighbours off screen
  const c = card.offsetHeight + 12, narrow = matchMedia('(max-width: 760px)').matches;
  zoomTo(ids, narrow ? 0 : c, narrow ? c : 0);
}

async function reveal(id) {
  const res = await fetch('/api/reveal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: id }) });
  document.getElementById('cardErr').textContent = res.ok ? '' : (await res.json()).error;
}
document.getElementById('reveal').onclick = () => selected && (selected.startsWith(SITE) ? openSite(selected) : reveal(selected));
const openSite = id => window.open(`https://${id.slice(SITE.length)}`, '_blank', 'noopener');
document.getElementById('home').onclick = () => { held = false; unfocus(); fit(true); };
document.getElementById('zoomIn').onclick = () => zoomBy(1 / 1.5);
document.getElementById('zoomOut').onclick = () => zoomBy(1.5);

// Drag to pan, wheel or pinch to zoom
// A press that doesn't move is a click: on a dot it selects it, elsewhere it clears the selection
let drag = null, hover = 0;
// The dot nearest a point on screen, within a finger's reach (12px): found from the positions, so dots need no
// invisible hit circles (one per file, each restyled on every zoom)
function nodeAt(cx, cy) {
  const r = svg.parentElement.getBoundingClientRect(), k = vb.w / r.width;
  const x = vb.x + (cx - r.left) * k, y = vb.y + (cy - r.top) * k;
  let best = null, d = (matchMedia('(pointer: coarse)').matches ? 20 : 12) * k;
  for (const [id, [px, py]] of pos) {
    const dd = Math.hypot(px - x, py - y);
    if (dd < d && nodeEl.has(id)) { d = dd; best = id; }
  }
  return best;
}
svg.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, node: nodeAt(e.clientX, e.clientY), moved: false };
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) {
    // a pointer over a dot, checked once a frame
    if (e.pointerType === 'mouse' && !hover) hover = requestAnimationFrame(() => { hover = 0; svg.style.cursor = nodeAt(e.clientX, e.clientY) ? 'pointer' : ''; });
    return;
  }
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) return;
  if (!drag.moved) { drag.moved = true; held = true; anim = null; svg.classList.add('drag'); svg.style.cursor = ''; }
  const k = vb.w / svg.clientWidth;
  vb.x = drag.vb.x - (e.clientX - drag.x) * k; vb.y = drag.vb.y - (e.clientY - drag.y) * k;
  moveView();
});
svg.addEventListener('pointerup', e => {
  if (drag && !drag.moved) {
    // the first click starts zooming, so the dot may have moved from under the second click of a double-click
    const again = lastTap.id && Date.now() - lastTap.t < 400 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 10;
    tap(again ? lastTap.id : drag.node);
    lastTap.x = e.clientX; lastTap.y = e.clientY;
  }
  drag = null; svg.classList.remove('drag');
});
addEventListener('keydown', e => { if (e.key === 'Escape') unfocus(); });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  anim = null; held = true;
  const k = Math.exp(e.deltaY * 0.0015), r = svg.parentElement.getBoundingClientRect(); // the svg itself may be mid-transform
  const mx = vb.x + (e.clientX - r.left) / r.width * vb.w, my = vb.y + (e.clientY - r.top) / r.height * vb.h;
  vb = { x: mx - (mx - vb.x) * k, y: my - (my - vb.y) * k, w: vb.w * k, h: vb.h * k };
  moveView();
}, { passive: false });
addEventListener('resize', fit);

(async () => {
  const info = await (await fetch('/api/info')).json();
  rootsList = info.roots;
  await loadGraph();
  // The page is read from disk on each load, but the server keeps the code it started with
  if (!info.version || older(info.version, PAGE_NEEDS)) {
    const note = document.getElementById('note');
    note.hidden = false; note.textContent = '';
    const b = document.createElement('b'); b.textContent = L.old; note.append(b);
  }
  const status = document.getElementById('status'), statusText = document.getElementById('statusText');
  statusText.textContent = L.off;
  let replay = true;
  const es = new EventSource('/api/events');
  es.onopen = () => { status.classList.add('on'); statusText.textContent = L.live; setTimeout(() => { replay = false; }, 300); };
  es.onerror = () => { status.classList.remove('on'); statusText.textContent = L.off; };
  const seen = new Set(); // a reconnect replays events the page already showed
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    if (seen.has(e.key)) return;
    seen.add(e.key);
    onEvent(e, !replay);
  };
})();
